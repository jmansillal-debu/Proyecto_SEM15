<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNO Classic Online</title>
  <link rel="stylesheet" href="styles.css?v=4.0">
  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- PANTALLA INICIAL / MENÚ -->
  <div id="screen-menu" class="screen active">
    <h1>UNO CLASSIC</h1>
    <div class="card-form">
      <input type="text" id="player-name-input" placeholder="Tu Apodo" maxlength="12">
      <button onclick="createRoom()" class="btn btn-primary">Crear Mesa</button>
      
      <div class="divider"><span>O</span></div>
      
      <input type="text" id="room-code-input" placeholder="Código de Mesa" style="text-transform:uppercase;">
      <button onclick="joinRoom()" class="btn btn-secondary">Unirse a Mesa</button>
    </div>

    <!-- HISTORIAL DE GANADORES -->
    <div class="winners-box">
      <h3>🏆 Últimos Ganadores</h3>
      <ul id="winners-history-list">
        <li class="empty-msg">Cargando historial...</li>
      </ul>
    </div>
  </div>

  <!-- PANTALLA LOBBY -->
  <div id="screen-lobby" class="screen">
    <h2>Mesa: <span id="lobby-code-display">----</span></h2>
    <p>Jugadores conectados (<span id="player-count">0</span>):</p>
    <ul id="lobby-players-list"></ul>
    
    <button id="btn-start-game" onclick="startGame()" class="btn btn-primary" style="display:none;">Iniciar Juego</button>
    <p id="waiting-msg" style="display:none;">Esperando a que el anfitrión inicie la partida...</p>
  </div>

  <!-- PANTALLA DE JUEGO -->
  <div id="screen-game" class="screen">
    <div class="game-header">
      <div>Turno: <strong id="turn-display">---</strong></div>
      <div>Color: <span id="active-color-indicator" class="color-dot"></span></div>
      <div>Acumulado: <strong id="stack-display">+0</strong></div>
    </div>

    <!-- ZONA OPONENTES -->
    <div id="opponents-zone" class="opponents-container"></div>

    <!-- MESA CENTRAL -->
    <div class="table-center">
      <div class="deck-pile" onclick="drawCardCurrentPlayer()">
        <div class="unocard card-back">
          <div class="card-inner">UNO</div>
        </div>
        <span>Comer</span>
      </div>
      
      <div class="discard-pile">
        <div id="top-card" class="unocard"></div>
      </div>
    </div>

    <!-- MANO Y CONTROLES DEL JUGADOR -->
    <div class="player-zone">
      <div class="player-info">
        <span>Tus cartas (<span id="my-card-count">0</span>)</span>
        <button onclick="sayUno()" class="btn-uno">¡UNO!</button>
      </div>
      <div id="my-hand" class="cards-carousel"></div>
    </div>

    <!-- MODAL ELECCIÓN DE COLOR -->
    <div id="color-modal" class="modal hidden">
      <div class="modal-content">
        <h3>Elige un nuevo color:</h3>
        <div class="color-selector">
          <button class="btn-color c-rojo" onclick="selectColor('rojo')">Rojo</button>
          <button class="btn-color c-azul" onclick="selectColor('azul')">Azul</button>
          <button class="btn-color c-verde" onclick="selectColor('verde')">Verde</button>
          <button class="btn-color c-amarillo" onclick="selectColor('amarillo')">Amarillo</button>
        </div>
      </div>
    </div>

    <!-- FLOTANTE CHAT DE LA SALA -->
    <div id="chat-widget" class="chat-widget">
      <button class="chat-toggle" onclick="toggleChat()">
        💬 Chat <span id="chat-badge" class="badge">0</span>
      </button>
      
      <div id="chat-box" class="chat-box hidden">
        <div class="chat-header">Chat de la Sala</div>
        <div id="chat-messages" class="chat-messages"></div>
        <div class="chat-input-row">
          <input type="text" id="chat-input" placeholder="Escribe un mensaje..." onkeypress="handleChatKey(event)">
          <button onclick="sendChatMessage()">Enviar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js?v=4.0"></script>
</body>
</html>
